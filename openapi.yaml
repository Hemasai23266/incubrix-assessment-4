openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Distribution
  description: Connector runtime, posting rules and certification for long-tail destinations.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/connectors:
    get:
      tags:
      - connectors
      summary: List Connectors
      operationId: list_connectors_api_v1_connectors_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connectors/{key}/disable:
    post:
      tags:
      - connectors
      summary: Disable Connector
      operationId: disable_connector_api_v1_connectors__key__disable_post
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connectors/{key}/enable:
    post:
      tags:
      - connectors
      summary: Enable Connector
      operationId: enable_connector_api_v1_connectors__key__enable_post
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations:
    post:
      tags:
      - destinations
      summary: Create Destination
      description: 'A new forum/community/site of a supported type is ONE row: no
        new connector code.'
      operationId: create_destination_api_v1_destinations_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - destinations
      summary: List Destinations
      operationId: list_destinations_api_v1_destinations_get
      parameters:
      - name: connector_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{dest_id}:
    get:
      tags:
      - destinations
      summary: Get Destination
      operationId: get_destination_api_v1_destinations__dest_id__get
      parameters:
      - name: dest_id
        in: path
        required: true
        schema:
          type: string
          title: Dest Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{dest_id}/revoke:
    post:
      tags:
      - destinations
      summary: Revoke Destination
      description: 'A partner revoked permission: block all further posting to it.'
      operationId: revoke_destination_api_v1_destinations__dest_id__revoke_post
      parameters:
      - name: dest_id
        in: path
        required: true
        schema:
          type: string
          title: Dest Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{dest_id}/check:
    post:
      tags:
      - rules
      summary: Check Rules
      description: 'Dry run: which rules would fire for this content? Nothing is posted
        or recorded.'
      operationId: check_rules_api_v1_destinations__dest_id__check_post
      parameters:
      - name: dest_id
        in: path
        required: true
        schema:
          type: string
          title: Dest Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rendition'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{dest_id}/certify:
    post:
      tags:
      - certification
      summary: Certify Destination
      operationId: certify_destination_api_v1_destinations__dest_id__certify_post
      parameters:
      - name: dest_id
        in: path
        required: true
        schema:
          type: string
          title: Dest Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CertifyIn'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{dest_id}/certifications:
    get:
      tags:
      - certification
      summary: List Certifications
      operationId: list_certifications_api_v1_destinations__dest_id__certifications_get
      parameters:
      - name: dest_id
        in: path
        required: true
        schema:
          type: string
          title: Dest Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/publish:
    post:
      tags:
      - publish
      summary: Publish
      description: Queue a publish. Same Idempotency-Key => same job, never a second
        post.
      operationId: publish_api_v1_publish_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/maintenance/cleanup-test-posts:
    post:
      tags:
      - certification
      summary: Cleanup
      operationId: cleanup_api_v1_maintenance_cleanup_test_posts_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files:
    post:
      tags:
      - files
      summary: Upload File
      description: 'Files in: upload; the stored copy gets a download link (S3-compatible
        storage).'
      operationId: upload_file_api_v1_files_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_api_v1_files_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/from-url:
    post:
      tags:
      - files
      summary: Fetch File From Url
      description: 'Files in, by URL: a background job downloads the file SAFELY (public
        addresses only, DNS pinned, redirects re-validated, size and

        type limits) and stores it; the job result carries the download link and the
        standard manifest.'
      operationId: fetch_file_from_url_api_v1_files_from_url_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/{key}:
    get:
      tags:
      - files
      summary: Download File
      operationId: download_file_api_v1_files__key__get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/simulation/faults/{instance}:
    post:
      tags:
      - simulation
      summary: Set Fault
      description: Flip a failure switch on a mock platform (simulation mode only).
      operationId: set_fault_api_v1_simulation_faults__instance__post
      parameters:
      - name: instance
        in: path
        required: true
        schema:
          type: string
          title: Instance
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/{method}:
    post:
      tags:
      - connector-contract
      summary: Connector Call
      description: 'Exact Appendix A contract. Methods return results only and never
        write to the database.

        The Idempotency-Key HEADER is required for every method including publish;
        a body field `idempotency_key` is NOT accepted in its place

        (the header value is the key that is sent on to the platform). A repeated
        identical request replays the first answer.'
      operationId: connector_call_connector_v1__connector_key___method__post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: Required. 1-200 printable ASCII characters, no spaces. A repeat
          with the same key replays the first answer.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_file_api_v1_files_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_v1_files_post
    CertifyIn:
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: CertifyIn
    DestinationIn:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        platform_key:
          type: string
          title: Platform Key
        surface:
          type: string
          title: Surface
          default: topic
        category:
          type: string
          title: Category
          default: ''
        audience_tags:
          items:
            type: string
          type: array
          title: Audience Tags
          default: []
        language:
          type: string
          title: Language
          default: en
        geo:
          type: string
          title: Geo
          default: global
        est_audience:
          type: integer
          title: Est Audience
          default: 0
        rules_url:
          type: string
          title: Rules Url
          default: ''
        frequency_cap:
          type: object
          title: Frequency Cap
        self_promo_allowed:
          type: boolean
          title: Self Promo Allowed
          default: false
        link_policy:
          type: string
          title: Link Policy
          default: allowed
        disclosure_required:
          type: boolean
          title: Disclosure Required
          default: false
        disclosure_text:
          type: string
          title: Disclosure Text
          default: This content was created with AI assistance.
        automation_allowed:
          type: boolean
          title: Automation Allowed
          default: true
        connector_key:
          type: string
          title: Connector Key
        relevance_score:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 1.0
          - type: 'null'
          title: Relevance Score
        relevance_reason:
          type: string
          title: Relevance Reason
          default: ''
        level:
          type: string
          title: Level
          default: L0
        credentials_ref:
          type: string
          title: Credentials Ref
          default: ''
        options:
          type: object
          title: Options
      type: object
      required:
      - name
      - url
      - platform_key
      - connector_key
      title: DestinationIn
    FaultIn:
      properties:
        auth_expired:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auth Expired
        rename:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Rename
        down:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Down
        revoked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Revoked
      type: object
      title: FaultIn
    FetchIn:
      properties:
        url:
          type: string
          title: Url
        filename:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Filename
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - url
      title: FetchIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Media:
      properties:
        url:
          type: string
          title: Url
          default: ''
        content_type:
          type: string
          title: Content Type
          default: ''
        filename:
          type: string
          title: Filename
          default: ''
      type: object
      title: Media
    PublishIn:
      properties:
        destination_id:
          type: string
          title: Destination Id
        rendition:
          $ref: '#/components/schemas/Rendition'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - destination_id
      - rendition
      title: PublishIn
    Rendition:
      properties:
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
          default: ''
        html:
          anyOf:
          - type: string
          - type: 'null'
          title: Html
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        media:
          items:
            $ref: '#/components/schemas/Media'
          type: array
          title: Media
          default: []
        tags:
          items:
            type: string
          type: array
          title: Tags
          default: []
        language:
          type: string
          title: Language
          default: en
        is_promotional:
          type: boolean
          title: Is Promotional
          default: false
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
        disclosure:
          anyOf:
          - type: string
          - type: 'null'
          title: Disclosure
      type: object
      required:
      - title
      title: Rendition
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
