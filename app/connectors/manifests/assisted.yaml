key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_post
    content_types: [text, image, video_link]
    spec: {title_max_chars: 300, body_max_chars: 40000, links_allowed: true, media_types: [image/png, image/jpeg, image/gif, video/mp4], max_media: 10}
rate_limits:
  per_connection: {requests: 1000, per_seconds: 60}
capabilities: [assist_pack]
error_map: {}
instance_param: submit_url
