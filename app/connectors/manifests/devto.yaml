key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image]
    spec: {title_max_chars: 128, body_max_chars: 100000, links_allowed: true, tags_max: 4, canonical_url_supported: true, media_types: [image/png, image/jpeg, image/gif], max_media: 5}
rate_limits:
  per_connection: {requests: 10, per_seconds: 30}
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "5xx": PLATFORM_UNAVAILABLE
notes: "Dev.to has no delete endpoint; delete() unpublishes the article."
instance_param: base_url
