key: webhook
version: 1.0.0
tier: bridge
auth: none
surfaces:
  - key: partner_post
    content_types: [text, image, video_link]
    spec: {title_max_chars: 300, body_max_chars: 200000, links_allowed: true, media_types: [image/png, image/jpeg, video/mp4], max_media: 10}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "5xx": PLATFORM_UNAVAILABLE
instance_param: base_url
notes: "Requests are signed: X-IncuBrix-Signature = sha256=HMAC(secret, timestamp + '.' + raw_body)."
