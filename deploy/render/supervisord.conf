[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:redis]
command=valkey-server --bind 127.0.0.1 --port 6379 --dir /tmp/redis --save "" --appendonly yes --appendfsync everysec --protected-mode yes
user=app
priority=10
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --proxy-headers --forwarded-allow-ips "*"
directory=/srv
user=app
priority=20
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=python deploy/render/run_worker.py
directory=/srv
user=app
priority=30
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:seed]
command=python scripts/seed_demo.py
directory=/srv
user=app
priority=40
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
